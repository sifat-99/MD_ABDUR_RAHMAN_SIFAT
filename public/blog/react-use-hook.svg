<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-react" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#091426"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="react-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="violet-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="react-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="react-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad-react)"/>
  <rect width="1200" height="675" fill="url(#react-grid)"/>

  <!-- Ambient Glows -->
  <circle cx="350" cy="270" r="280" fill="#06b6d4" opacity="0.16" filter="url(#react-glow)"/>
  <circle cx="850" cy="320" r="300" fill="#8b5cf6" opacity="0.14" filter="url(#react-glow)"/>

  <!-- Center React Atom Structure -->
  <g transform="translate(600, 260)">
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="120" ry="46" fill="none" stroke="url(#react-cyan)" stroke-width="3" opacity="0.85" filter="url(#react-glow)"/>
    <ellipse cx="0" cy="0" rx="120" ry="46" fill="none" stroke="url(#react-cyan)" stroke-width="3" opacity="0.85" transform="rotate(60)" filter="url(#react-glow)"/>
    <ellipse cx="0" cy="0" rx="120" ry="46" fill="none" stroke="url(#react-cyan)" stroke-width="3" opacity="0.85" transform="rotate(120)" filter="url(#react-glow)"/>
    
    <!-- Central Nucleus Badge -->
    <circle cx="0" cy="0" r="28" fill="url(#react-cyan)"/>
    <text x="0" y="7" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#032130" text-anchor="middle">19</text>
  </g>

  <!-- Feature Pills -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">
    <!-- Top Left: use(Promise) -->
    <g transform="translate(160, 210)">
      <rect width="250" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#38bdf8"/>
      <text x="36" y="26" fill="#7dd3fc" font-weight="600">use(Promise) in Render</text>
    </g>

    <!-- Bottom Left: Conditional Hooks -->
    <g transform="translate(140, 290)">
      <rect width="270" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(192, 132, 252, 0.45)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#c084fc"/>
      <text x="36" y="26" fill="#e9d5ff" font-weight="600">Conditional `if` Support</text>
    </g>

    <!-- Top Right: use(Context) -->
    <g transform="translate(790, 210)">
      <rect width="240" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(236, 72, 153, 0.45)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#ec4899"/>
      <text x="36" y="26" fill="#fbcfe8" font-weight="600">Context Replacement</text>
    </g>

    <!-- Bottom Right: Suspense Streaming -->
    <g transform="translate(810, 290)">
      <rect width="240" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(34, 197, 94, 0.45)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#22c55e"/>
      <text x="36" y="26" fill="#86efac" font-weight="600">Suspense Streaming</text>
    </g>
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <text x="600" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Mastering React 19: The New `use()` Hook
  </text>
  <text x="600" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    First-Class Async Handling, Conditional Reads, and Modern State Architecture
  </text>
</svg>
