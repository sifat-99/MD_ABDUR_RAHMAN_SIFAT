<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a16"/>
      <stop offset="50%" stop-color="#120c24"/>
      <stop offset="100%" stop-color="#06060c"/>
    </linearGradient>
    <linearGradient id="php-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8892be"/>
      <stop offset="50%" stop-color="#4F5B93"/>
      <stop offset="100%" stop-color="#2d3559"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(139, 92, 246, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="300" cy="250" r="280" fill="#7c3aed" opacity="0.18" filter="url(#glow)"/>
  <circle cx="850" cy="380" r="320" fill="#ec4899" opacity="0.14" filter="url(#glow)"/>
  <circle cx="600" cy="320" r="220" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>

  <!-- Center Security Shield -->
  <g transform="translate(600, 270)">
    <!-- Outer Shield Halo -->
    <path d="M 0 -130 Q 130 -110 130 30 Q 130 140 0 190 Q -130 140 -130 30 Q -130 -110 0 -130 Z" 
          fill="none" stroke="url(#shield-grad)" stroke-width="4" opacity="0.8" filter="url(#glow)"/>
    
    <!-- Shield Glass Fill -->
    <path d="M 0 -120 Q 120 -100 120 25 Q 120 130 0 178 Q -120 130 -120 25 Q -120 -100 0 -120 Z" 
          fill="rgba(18, 14, 38, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

    <!-- PHP Oval Pill Badge -->
    <ellipse cx="0" cy="15" rx="75" ry="42" fill="url(#php-purple)" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PHP</text>

    <!-- Padlock Shackle on top of shield -->
    <path d="M -35 -115 C -35 -160 35 -160 35 -115" fill="none" stroke="url(#neon-cyan)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="6" fill="#38bdf8"/>
    <path d="M 0 -60 L 0 -45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Decorative Vulnerability Code Tags -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">
    <!-- Left badge: RCE Prevention -->
    <g transform="translate(180, 240)">
      <rect width="210" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#ef4444"/>
      <text x="36" y="26" fill="#fca5a5" font-weight="600">CVE / RCE Defense</text>
    </g>

    <!-- Left badge: Deserialization -->
    <g transform="translate(140, 310)">
      <rect width="250" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#eab308"/>
      <text x="36" y="26" fill="#fef08a" font-weight="600">unserialize() Exploit</text>
    </g>

    <!-- Right badge: Type Juggling -->
    <g transform="translate(800, 240)">
      <rect width="220" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#a855f7"/>
      <text x="36" y="26" fill="#d8b4fe" font-weight="600">Strict Types (===)</text>
    </g>

    <!-- Right badge: SQL Injection -->
    <g transform="translate(820, 310)">
      <rect width="240" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#22c55e"/>
      <text x="36" y="26" fill="#86efac" font-weight="600">PDO Prepared Stmts</text>
    </g>
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <text x="600" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Modern PHP Security &amp; Vulnerability Deep-Dive
  </text>
  <text x="600" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Defending Against Type Juggling, Insecure Deserialization, SSRF, &amp; RCE
  </text>
</svg>
