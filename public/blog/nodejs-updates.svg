<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120b"/>
      <stop offset="50%" stop-color="#091c13"/>
      <stop offset="100%" stop-color="#040a07"/>
    </linearGradient>
    <linearGradient id="node-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="ts-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="node-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(34, 197, 94, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad-node)"/>
  <rect width="1200" height="675" fill="url(#node-grid)"/>

  <!-- Ambient Glows -->
  <circle cx="350" cy="260" r="280" fill="#22c55e" opacity="0.15" filter="url(#node-glow)"/>
  <circle cx="850" cy="350" r="300" fill="#3b82f6" opacity="0.14" filter="url(#node-glow)"/>

  <!-- Center Node.js Hexagon with TS & SQLite orbiting badges -->
  <g transform="translate(600, 260)">
    <!-- Outer Glowing Hexagon -->
    <polygon points="0,-125 108,-62 108,62 0,125 -108,62 -108,-62" 
             fill="none" stroke="url(#node-green)" stroke-width="4" opacity="0.85" filter="url(#node-glow)"/>
    
    <!-- Inner Glass Hexagon -->
    <polygon points="0,-115 100,-58 100,58 0,115 -100,58 -100,-58" 
             fill="rgba(8, 28, 18, 0.8)" stroke="rgba(74, 222, 128, 0.25)" stroke-width="1.5"/>

    <!-- Stylized Node.js Emblem -->
    <path d="M 0 -65 L 56 -33 L 56 33 L 0 65 L -56 33 L -56 -33 Z" fill="url(#node-green)"/>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" font-weight="900" fill="#052e16" text-anchor="middle" letter-spacing="-1">N</text>
  </g>

  <!-- Feature Pills -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">
    <!-- Top Left: Native TypeScript -->
    <g transform="translate(180, 210)">
      <rect width="250" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(96, 165, 250, 0.45)" stroke-width="1"/>
      <rect x="14" y="11" width="20" height="20" rx="3" fill="#3178c6"/>
      <text x="18" y="25" fill="#ffffff" font-size="11" font-weight="800">TS</text>
      <text x="44" y="26" fill="#93c5fd" font-weight="600">--strip-types</text>
    </g>

    <!-- Bottom Left: Built-in SQLite -->
    <g transform="translate(150, 290)">
      <rect width="240" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(45, 212, 191, 0.45)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#2dd4bf"/>
      <text x="36" y="26" fill="#99f6e4" font-weight="600">node:sqlite Module</text>
    </g>

    <!-- Top Right: Native Env File -->
    <g transform="translate(780, 210)">
      <rect width="240" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(250, 204, 21, 0.45)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#facc15"/>
      <text x="36" y="26" fill="#fef08a" font-weight="600">Native --env-file</text>
    </g>

    <!-- Bottom Right: V8 & WebCrypto -->
    <g transform="translate(800, 290)">
      <rect width="240" height="42" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(34, 197, 94, 0.45)" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#22c55e"/>
      <text x="36" y="26" fill="#86efac" font-weight="600">WebCrypto &amp; V8 Speed</text>
    </g>
  </g>

  <!-- Title & Subtitle Banner at bottom -->
  <text x="600" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    The Node.js Revolution: Modern Native Tooling
  </text>
  <text x="600" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Native TypeScript Execution, Built-in SQLite, and Zero-Config Environments
  </text>
</svg>
